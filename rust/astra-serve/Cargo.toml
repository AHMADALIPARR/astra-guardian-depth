[package]
name = "astra-serve"
version = "0.1.0"
edition = "2021"
description = "Production serving layer for the Astra recurrent-depth transformer: request batching, adaptive loop-count scheduling, FFI to the CUDA kernels"

[lib]
name = "astra_serve"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# cuda: link the kernels in ../../cuda/ (needs nvcc-built objects).
# Off by default so `cargo test` exercises the pure-Rust logic.
cuda = []
